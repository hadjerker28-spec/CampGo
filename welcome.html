<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampGo - Adventure Awaits</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Phosphor Icons for the UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="welcome-page">
    
   
    <main class="hero-content">
        <div class="brand-section">
            
                
            </div>
            <h1 class="logo-text">Camp<span>Go</span></h1>
        </div>

        <div class="welcome-text">
            <h2>Welcome to <span>CampGo</span></h2>
            <p>Explore amazing places, plan your trips, and live your adventure.</p>
        </div>

        <div class="cta-container">
            <a href="login.html" class="btn btn-login">
                <i class="ph ph-user"></i>
                <div class="btn-text">
                    <span class="main-label">Sign In</span>
                    <span class="sub-label">Welcome back!</span>
                </div>
            </a>
            <a href="signup.html" class="btn btn-signup">
                <i class="ph ph-user-plus"></i>
                <div class="btn-text">
                    <span class="main-label">Sign Up</span>
                    <span class="sub-label">Create an account</span>
                </div>
            </a>
        </div>
    </main>

    <footer class="bottom-footer">
        <p><i class="ph ph-tree"></i><i class="ph ph-tree"></i> Adventure is calling. <span>Are you ready?</span></p>
    </footer>

</html>
